<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jcode 浏览器接管示例</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 0.8rem 0; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; }
    button { padding: 0.45rem 0.8rem; margin-right: 0.5rem; font: inherit; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f4f4; padding: 1rem; }
    .approval { border: 1px solid #bbb; padding: 0.8rem; margin: 0.7rem 0; }
  </style>
</head>
<body>
  <h1>Jcode 浏览器接管示例</h1>
  <p>从服务实例取得 endpoint、Token 和 Session ID。页面只在内存中保存 Token。</p>
  <label>服务 endpoint <input id="endpoint" autocomplete="off" placeholder="http://127.0.0.1:8787"></label>
  <label>服务 Token <input id="token" type="password" autocomplete="off"></label>
  <label>或选择本机 service.token 文件 <input id="tokenFile" type="file"></label>
  <label>Session ID <input id="session" autocomplete="off"></label>
  <button id="connect">读取快照并订阅</button>
  <button id="disconnect">断开本页面</button>
  <p id="status" role="status">尚未连接</p>
  <h2>待处理审批</h2>
  <div id="approvals"></div>
  <h2>会话状态</h2>
  <pre id="snapshot"></pre>
  <script>
    const fields = {
      endpoint: document.getElementById('endpoint'),
      token: document.getElementById('token'),
      session: document.getElementById('session'),
      status: document.getElementById('status'),
      approvals: document.getElementById('approvals'),
      snapshot: document.getElementById('snapshot')
    };
    const parameters = new URLSearchParams(location.search);
    fields.endpoint.value = parameters.get('endpoint') || '';
    fields.session.value = parameters.get('sessionId') || '';
    document.getElementById('tokenFile').addEventListener('change', async event => {
      const file = event.target.files?.[0];
      if (file) fields.token.value = (await file.text()).trim();
    });
    let activeConnection;

    function isCurrent(connection) {
      return activeConnection === connection && !connection.controller.signal.aborted;
    }

    async function responseError(response, label) {
      const body = await response.text();
      let code;
      try { code = JSON.parse(body).code; } catch { /* An HTTP error need not be JSON. */ }
      const error = new Error(`${label} ${response.status}: ${body}`);
      error.status = response.status;
      error.code = code;
      return error;
    }

    async function api(connection, path, options = {}) {
      const response = await fetch(path, {
        ...options,
        signal: connection.controller.signal,
        headers: {
          Authorization: 'Bearer ' + connection.token,
          ...options.headers
        }
      });
      if (!response.ok) {
        throw await responseError(response, 'HTTP');
      }
      return response.json();
    }

    function cursor(value) {
      return `${value.epoch}:${value.seq}`;
    }

    function render(connection, snapshot) {
      if (!isCurrent(connection)) return;
      fields.snapshot.textContent = JSON.stringify({
        sessionId: snapshot.sessionId,
        cursor: snapshot.cursor,
        runs: snapshot.runs,
        inputs: snapshot.inputs,
        approvals: snapshot.approvals,
        tools: snapshot.tools
      }, null, 2);
      fields.approvals.replaceChildren();
      for (const approval of snapshot.approvals.filter(item => item.status === 'PENDING')) {
        const card = document.createElement('div');
        card.className = 'approval';
        const title = document.createElement('p');
        title.textContent = `${approval.toolCallId} · ${approval.approvalId}`;
        card.append(title);
        for (const decision of ['ALLOW', 'DENY']) {
          const button = document.createElement('button');
          button.textContent = decision === 'ALLOW' ? '允许一次' : '拒绝';
          button.addEventListener('click', async () => {
            try {
              await api(connection, connection.base + '/approvals/' + encodeURIComponent(approval.approvalId)
                + '/resolve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  approvalId: approval.approvalId,
                  toolCallId: approval.toolCallId,
                  requestDigest: approval.requestDigest,
                  decision
                })
              });
            } catch (error) {
              if (isCurrent(connection)) fields.status.textContent = error.message;
            }
          });
          card.append(button);
        }
        fields.approvals.append(card);
      }
    }

    async function refresh(connection) {
      const snapshot = await api(connection, connection.base + '/snapshot');
      if (!isCurrent(connection)) return;
      if (snapshot.schemaVersion !== 1 || snapshot.sessionId !== connection.sessionId) {
        throw new Error('快照不属于当前会话或版本不受支持');
      }
      render(connection, snapshot);
      connection.snapshot = snapshot;
      connection.cursor = cursor(snapshot.cursor);
    }

    function upsert(items, next, identity, limit, evictable = () => true) {
      const updated = [...items];
      const index = updated.findIndex(item => identity(item) === identity(next));
      if (index >= 0) updated[index] = next;
      else updated.push(next);
      if (updated.length > limit) {
        const oldest = updated.findIndex(evictable);
        if (oldest < 0) throw new Error('投影保留数量超限');
        updated.splice(oldest, 1);
      }
      return updated;
    }

    function applyEvent(connection, event, id) {
      const snapshot = connection.snapshot;
      if (event.schemaVersion !== 1 || event.sessionId !== connection.sessionId
          || event.cursor.epoch !== snapshot.cursor.epoch || cursor(event.cursor) !== id) {
        throw new Error('事件不属于当前会话流');
      }
      if (event.cursor.seq <= snapshot.cursor.seq) return;
      if (event.cursor.seq !== snapshot.cursor.seq + 1) {
        const error = new Error('事件序号存在缺口');
        error.resync = true;
        throw error;
      }
      const next = { ...snapshot, cursor: event.cursor };
      const data = event.data;
      switch (event.type) {
        case 'RUN_CHANGED':
          next.runs = upsert(snapshot.runs, data, item => item.runId, 1024); break;
        case 'INPUT_CHANGED':
          next.inputs = upsert(snapshot.inputs, data, item => item.inputId, 1024); break;
        case 'APPROVAL_CHANGED':
          next.approvals = upsert(snapshot.approvals, data, item => item.approvalId, 256,
            item => item.status !== 'PENDING'); break;
        case 'MESSAGE_CHANGED':
          next.messages = upsert(snapshot.messages, data, item => item.messageId, 256);
          if (data.entryId != null) next.leafId = data.entryId;
          break;
        case 'TOOL_CHANGED':
          next.tools = upsert(snapshot.tools, data,
            item => JSON.stringify([item.runId, item.toolCallId]), 256); break;
        case 'HISTORY_CHANGED':
          next.leafId = data.leafId; break;
        default:
          throw new Error(`不支持的事件类型：${event.type}`);
      }
      render(connection, next);
      connection.snapshot = next;
      connection.cursor = id;
    }

    async function applyFrame(connection, frame) {
      if (!isCurrent(connection)) return;
      const lines = frame.split('\n');
      const name = lines.find(line => line.startsWith('event: '))?.slice(7);
      const id = lines.find(line => line.startsWith('id: '))?.slice(4);
      const data = lines.find(line => line.startsWith('data: '))?.slice(6);
      if (name === 'stream.control') {
        const control = JSON.parse(data);
        if (control.action === 'stop') {
          fields.status.textContent = '会话事件流已关闭';
          connection.controller.abort();
        } else {
          const error = new Error('事件流要求重新同步');
          error.resync = true;
          throw error;
        }
      } else if (name === 'session.event' && id) {
        applyEvent(connection, JSON.parse(data), id);
      }
    }

    function retryDelay(connection) {
      return new Promise(resolve => {
        if (!isCurrent(connection)) return resolve();
        const signal = connection.controller.signal;
        const timer = setTimeout(done, 300);
        function done() {
          clearTimeout(timer);
          signal.removeEventListener('abort', done);
          resolve();
        }
        signal.addEventListener('abort', done, { once: true });
      });
    }

    async function subscribe(connection) {
      while (isCurrent(connection)) {
        let reader;
        try {
          const response = await apiStream(connection);
          if (!isCurrent(connection)) return;
          fields.status.textContent = '已订阅事件流';
          reader = response.body.getReader();
          const decoder = new TextDecoder();
          let pending = '';
          while (isCurrent(connection)) {
            const { value, done } = await reader.read();
            if (done) break;
            pending += decoder.decode(value, { stream: true });
            pending = pending.replace(/\r\n/g, '\n');
            let boundary;
            while ((boundary = pending.indexOf('\n\n')) >= 0) {
              const completeFrame = pending.slice(0, boundary);
              pending = pending.slice(boundary + 2);
              await applyFrame(connection, completeFrame);
              if (!isCurrent(connection)) return;
            }
          }
          if (isCurrent(connection)) fields.status.textContent = '连接中断，正在重连';
        } catch (error) {
          if (!isCurrent(connection)) return;
          if (error.resync || error.code === 'CURSOR_EXPIRED'
              || error.code === 'EPOCH_CHANGED') {
            try {
              await refresh(connection);
              continue;
            } catch (failure) {
              error = failure;
            }
          }
          if (!isCurrent(connection)) return;
          if (error.status && error.status !== 408 && error.status !== 429
              && (error.status < 500 || error.status > 504)) {
            fields.status.textContent = error.message;
            return;
          }
          fields.status.textContent = `${error.message}；正在重连`;
        } finally {
          if (reader) {
            try { await reader.cancel(); } catch { /* The stream may already have failed. */ }
            reader.releaseLock();
          }
        }
        await retryDelay(connection);
      }
    }

    async function apiStream(connection) {
      const response = await fetch(connection.base + '/events?after='
        + encodeURIComponent(connection.cursor), {
        headers: {
          Authorization: 'Bearer ' + connection.token,
          'Last-Event-ID': connection.cursor
        },
        signal: connection.controller.signal
      });
      if (!response.ok) {
        throw await responseError(response, 'SSE HTTP');
      }
      return response;
    }

    document.getElementById('connect').addEventListener('click', async () => {
      activeConnection?.controller.abort();
      const sessionId = fields.session.value;
      const connection = {
        base: fields.endpoint.value.replace(/\/$/, '')
          + '/v1/sessions/' + encodeURIComponent(sessionId),
        sessionId,
        token: fields.token.value,
        controller: new AbortController(),
        cursor: undefined,
        snapshot: undefined
      };
      activeConnection = connection;
      try {
        await refresh(connection);
        if (!isCurrent(connection)) return;
        fields.status.textContent = '快照已读取，正在订阅';
        subscribe(connection).catch(error => {
          if (isCurrent(connection)) fields.status.textContent = error.message;
        });
      } catch (error) {
        if (isCurrent(connection)) fields.status.textContent = error.message;
      }
    });
    document.getElementById('disconnect').addEventListener('click', () => {
      activeConnection?.controller.abort();
      activeConnection = undefined;
      fields.status.textContent = '本页面已断开';
    });
  </script>
</body>
</html>
