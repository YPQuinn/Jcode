<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jcode 浏览器接管示例</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 0.8rem 0; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; }
    button { padding: 0.45rem 0.8rem; margin-right: 0.5rem; font: inherit; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f4f4; padding: 1rem; }
    .approval { border: 1px solid #bbb; padding: 0.8rem; margin: 0.7rem 0; }
  </style>
</head>
<body>
  <h1>Jcode 浏览器接管示例</h1>
  <p>从服务实例取得 endpoint、Token 和 Session ID。页面只在内存中保存 Token。</p>
  <label>服务 endpoint <input id="endpoint" autocomplete="off" placeholder="http://127.0.0.1:8787"></label>
  <label>服务 Token <input id="token" type="password" autocomplete="off"></label>
  <label>或选择本机 service.token 文件 <input id="tokenFile" type="file"></label>
  <label>Session ID <input id="session" autocomplete="off"></label>
  <button id="connect">读取快照并订阅</button>
  <button id="disconnect">断开本页面</button>
  <p id="status" role="status">尚未连接</p>
  <h2>待处理审批</h2>
  <div id="approvals"></div>
  <h2>会话状态</h2>
  <pre id="snapshot"></pre>
  <script>
    const fields = {
      endpoint: document.getElementById('endpoint'),
      token: document.getElementById('token'),
      session: document.getElementById('session'),
      status: document.getElementById('status'),
      approvals: document.getElementById('approvals'),
      snapshot: document.getElementById('snapshot')
    };
    const parameters = new URLSearchParams(location.search);
    fields.endpoint.value = parameters.get('endpoint') || '';
    fields.session.value = parameters.get('sessionId') || '';
    document.getElementById('tokenFile').addEventListener('change', async event => {
      const file = event.target.files?.[0];
      if (file) fields.token.value = (await file.text()).trim();
    });
    let controller;
    let lastAppliedId;

    function base() {
      return fields.endpoint.value.replace(/\/$/, '')
        + '/v1/sessions/' + encodeURIComponent(fields.session.value);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          Authorization: 'Bearer ' + fields.token.value,
          ...options.headers
        }
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${await response.text()}`);
      }
      return response.json();
    }

    function cursor(value) {
      return `${value.epoch}:${value.seq}`;
    }

    async function refresh() {
      const snapshot = await api(base() + '/snapshot');
      fields.snapshot.textContent = JSON.stringify({
        sessionId: snapshot.sessionId,
        cursor: snapshot.cursor,
        runs: snapshot.runs,
        inputs: snapshot.inputs,
        tools: snapshot.tools
      }, null, 2);
      fields.approvals.replaceChildren();
      for (const approval of snapshot.approvals.filter(item => item.status === 'PENDING')) {
        const card = document.createElement('div');
        card.className = 'approval';
        const title = document.createElement('p');
        title.textContent = `${approval.toolCallId} · ${approval.approvalId}`;
        card.append(title);
        for (const decision of ['ALLOW', 'DENY']) {
          const button = document.createElement('button');
          button.textContent = decision === 'ALLOW' ? '允许一次' : '拒绝';
          button.addEventListener('click', async () => {
            try {
              await api(base() + '/approvals/' + encodeURIComponent(approval.approvalId)
                + '/resolve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  approvalId: approval.approvalId,
                  toolCallId: approval.toolCallId,
                  requestDigest: approval.requestDigest,
                  decision
                })
              });
              await refresh();
            } catch (error) {
              fields.status.textContent = error.message;
            }
          });
          card.append(button);
        }
        fields.approvals.append(card);
      }
      return snapshot;
    }

    async function applyFrame(frame) {
      const lines = frame.split('\n');
      const name = lines.find(line => line.startsWith('event: '))?.slice(7);
      const id = lines.find(line => line.startsWith('id: '))?.slice(4);
      if (name === 'stream.control') {
        const data = lines.find(line => line.startsWith('data: '))?.slice(6);
        const control = JSON.parse(data);
        if (control.action === 'stop') {
          fields.status.textContent = '会话事件流已关闭';
          controller.abort();
        } else {
          const snapshot = await refresh();
          lastAppliedId = cursor(snapshot.cursor);
        }
      } else if (name === 'session.event' && id) {
        const data = lines.find(line => line.startsWith('data: '))?.slice(6);
        JSON.parse(data);
        const snapshot = await refresh();
        lastAppliedId = cursor(snapshot.cursor);
      }
    }

    async function subscribe(signal) {
      while (!signal.aborted) {
        const decoder = new TextDecoder();
        const response = await fetch(base() + '/events?after='
          + encodeURIComponent(lastAppliedId), {
          headers: {
            Authorization: 'Bearer ' + fields.token.value,
            'Last-Event-ID': lastAppliedId
          },
          signal
        });
        if (!response.ok) {
          throw new Error(`SSE HTTP ${response.status}: ${await response.text()}`);
        }
        fields.status.textContent = '已订阅事件流';
        const reader = response.body.getReader();
        let pending = '';
        try {
          while (!signal.aborted) {
            const { value, done } = await reader.read();
            if (done) break;
            pending += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
            let boundary;
            while ((boundary = pending.indexOf('\n\n')) >= 0) {
              const completeFrame = pending.slice(0, boundary);
              pending = pending.slice(boundary + 2);
              await applyFrame(completeFrame);
            }
          }
        } finally {
          reader.releaseLock();
        }
        if (!signal.aborted) fields.status.textContent = '连接中断，按最后完整事件重连';
      }
    }

    document.getElementById('connect').addEventListener('click', async () => {
      controller?.abort();
      const connection = new AbortController();
      controller = connection;
      try {
        const snapshot = await refresh();
        lastAppliedId = cursor(snapshot.cursor);
        fields.status.textContent = '快照已读取，正在订阅';
        subscribe(connection.signal).catch(error => {
          if (!connection.signal.aborted) fields.status.textContent = error.message;
        });
      } catch (error) {
        fields.status.textContent = error.message;
      }
    });
    document.getElementById('disconnect').addEventListener('click', () => {
      controller?.abort();
      fields.status.textContent = '本页面已断开';
    });
  </script>
</body>
</html>
